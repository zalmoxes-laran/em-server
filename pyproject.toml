[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "em-server"
version = "0.1.0.dev0"
description = "The s3Dgraphy access API over HTTP — thin FastAPI wrapper (StratiGraph)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Emanuel Demetrescu", email = "emanuel.demetrescu@cnr.it" }]
keywords = ["extended matrix", "archaeology", "fastapi", "cidoc-crm"]

# Deliberately three lines long. em-server adds a transport and nothing else, so
# its dependencies are the library it exposes plus the server that exposes it.
# Everything heavy is OPTIONAL and stays optional (see the extras): a deployment
# that only validates graphs should not have to ship PROJ or an RDF stack.
dependencies = [
    # EXACT pin, with the extras. Three reasons it is spelled this way:
    #   · PEP 440 will not resolve a pre-release unless the specifier names one,
    #     so `>=1.6` matches nothing while 1.6 is a dev series (verified: it kills
    #     the Docker build at the pip step);
    #   · dev12 is the first release that ships `s3dgraphy/api.py` — the surface
    #     this whole service wraps — so anything older cannot even import;
    #   · [geo] brings pyproj (with PROJ inside the wheel: no system GDAL) and
    #     [rdf] brings rdflib. Without them /v1/reproject and /v1/export-ttl are
    #     honest 501s rather than working endpoints.
    # Loosen to `>=1.6` once 1.6.0 final is out.
    "s3dgraphy[geo,rdf]==1.6.0.dev12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # P1 auth: verify the realm's RS256 tokens against its published JWKS.
    #
    # A HARD dependency, not an extra, and deliberately so: making auth optional
    # would mean a build that cannot enforce it, and the failure mode of *that* is
    # a deployment which comes up open because the wheel was thin. 31 KB for PyJWT
    # plus `cryptography`, which the TLS stack already pulls in.
    #
    # PyJWT and not python-jose: one library, actively maintained, and the JWKS
    # handling is a few lines here rather than a second framework. `[crypto]`
    # brings the RSA/EC backend — without it PyJWT can only do HMAC, which is
    # exactly the algorithm we refuse.
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
# Kept as NAMES for the capabilities they buy, even though the base pin already
# carries both: `pip install em-server[geo]` reads as intent, and the day the base
# pin is loosened these are the knobs that stay meaningful.
rdf = ["s3dgraphy[rdf]==1.6.0.dev12"]      # /v1/export-ttl
geo = ["s3dgraphy[geo]==1.6.0.dev12"]      # /v1/reproject (pyproj bundles PROJ)
all = ["s3dgraphy[rdf,geo]==1.6.0.dev12"]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
